name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.0
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile script/report.py

      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0, 'script'); import report"

      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.5
          ruff check script/

      - name: Validate state snapshot JSON
        run: python -m json.tool state/snapshot.json > /dev/null
